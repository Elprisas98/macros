<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Macros</title>
  <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Macros">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <nav id="tabbar" class="tabbar" hidden></nav>
  <div id="sheet-root"></div>
  <div id="toast" class="toast"></div>
  <input id="cam-input" type="file" accept="image/*" capture="environment" hidden>
  <input id="lib-input" type="file" accept="image/*" hidden>
  <input id="import-input" type="file" accept="application/json,.json" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>
